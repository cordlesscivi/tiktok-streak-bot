name: TikTok Streak Bot (API)

on:
  schedule:
    - cron: '0 9 * * *' # Запуск каждый день в 09:00 UTC (12:00 по Минску)
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

    
      # 1. ПОДГОТОВКА И ЗАПУСК ПЕРВОГО АККАУНТА
 
      - name: Prepare config for Account 1
        env:
          MESSAGE_TEXT: ${{ secrets.MESSAGE_TEXT }}
        run: |
          mkdir -p data
          cat > data/config.json <<EOF
          {
            "MESSAGE_TO_SEND": "$MESSAGE_TEXT",
            "TARGET_SEND_TIME_HM": [12, 0],
            "COOKIES_FILE": "cookies.json",
            "LOG_FILENAME": "data/tiktok_bot.log",
            "TEST_MODE": false
          }
          EOF

      - name: Run Bot for Account 1
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: |
          echo "$TIKTOK_COOKIES" > data/cookies.json
          python main.py --oneshot

 
      # 2. ПОДГОТОВКА И ЗАПУСК ВТОРОГО АККАУНТА
     
      - name: Prepare config for Account 2
        env:
          MESSAGE_TEXT_2: ${{ secrets.MESSAGE_TEXT_2 }}
        run: |
          # Перезаписываем config.json новым текстом для второго аккаунта
          cat > data/config.json <<EOF
          {
            "MESSAGE_TO_SEND": "$MESSAGE_TEXT_2",
            "TARGET_SEND_TIME_HM": [12, 0],
            "COOKIES_FILE": "cookies.json",
            "LOG_FILENAME": "data/tiktok_bot.log",
            "TEST_MODE": false
          }
          EOF

      - name: Run Bot for Account 2
        env:
          TIKTOK_COOKIES_2: ${{ secrets.TIKTOK_COOKIES_2 }}
        run: |
          echo "$TIKTOK_COOKIES_2" > data/cookies.json
          python main.py --oneshot
