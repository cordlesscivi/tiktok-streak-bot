name: Keepalive

on:
  schedule:
    - cron: '0 0 1 * *' # Запуск 1-го числа каждого месяца
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write  # Важно: даём разрешение на управление workflow
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
